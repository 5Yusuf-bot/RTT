workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/core @capacitor/cli
      - name: Sync Capacitor
        script: npx @capacitor/cli sync ios
    artifacts:
      - build/ios/ipa/*.ipa
