workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    scripts:
      - name: Setup & Build iOS
        script: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "TransferCarki" "com.transfercarki.app" --web-dir "."
          npx cap add ios
          npx cap sync ios
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO BUILD_DIR=../../build
      - name: Package IPA
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/Release-iphoneos/App.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r App.ipa Payload
    artifacts:
      - build/ios/ipa/App.ipa
